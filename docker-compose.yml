# Modern Pet Project Stack
# - Prefect 3 for workflow orchestration (replaces Airflow)
# - OpenMetadata for data catalog and lineage (replaces Amundsen + Atlas)
# - Kafka for streaming
# - Spark for data processing
# - Prometheus/Grafana for monitoring
#
# Requirements: Docker with at least 6 CPU, 12 GB Memory, 2 GB Swap
---
services:
  # =============================================================================
  # DATA SOURCES (Pet Registration Database)
  # =============================================================================
  pet-postgres:
    image: postgres:16
    container_name: pet_postgres
    environment:
      POSTGRES_USER: petdb
      POSTGRES_PASSWORD: petdb
      POSTGRES_DB: petdb
    volumes:
      - pet-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-pet-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # =============================================================================
  # DATA OUTPUT (Aggregated Results for Grafana)
  # =============================================================================
  output-postgres:
    image: postgres:16
    container_name: output_postgres
    environment:
      POSTGRES_USER: outputdb
      POSTGRES_PASSWORD: outputdb
      POSTGRES_DB: outputdb
    volumes:
      - output-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-output-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outputdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # =============================================================================
  # PREFECT STACK (Workflow Orchestration)
  # =============================================================================
  prefect-postgres:
    image: postgres:16
    container_name: prefect_postgres
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  prefect-redis:
    image: redis:7-alpine
    container_name: prefect_redis
    ports:
      - "6380:6379"
    volumes:
      - prefect-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: prefect-redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect_worker
    command: prefect worker start --pool local-pool
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./flows:/app/flows
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: always

  # =============================================================================
  # OPENMETADATA STACK (Data Catalog & Lineage)
  # =============================================================================
  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.6.0
    container_name: openmetadata_migrate
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh migrate"]
    environment:
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata
      OM_DATABASE: openmetadata
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
    restart: "no"

  openmetadata-mysql:
    image: mysql:8.0
    container_name: openmetadata_mysql
    environment:
      MYSQL_ROOT_PASSWORD: openmetadata
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata
      MYSQL_DATABASE: openmetadata
    volumes:
      - openmetadata-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-popenmetadata"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: openmetadata_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - openmetadata-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.6.0
    container_name: openmetadata_server
    environment:
      # Database Configuration
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata
      OM_DATABASE: openmetadata
      # Elasticsearch Configuration
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      # Authentication - Basic auth (admin/admin)
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: "https://accounts.google.com"
      AUTHENTICATION_CLIENT_ID: ""
      AUTHENTICATION_CALLBACK_URL: ""
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8585/api/v1/system/version"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always

  # =============================================================================
  # KAFKA STACK (Event Streaming)
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  broker:
    image: confluentinc/cp-server:7.5.0
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: anonymous
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  kafka-tools:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_tools
    command: ["tail", "-f", "/dev/null"]
    network_mode: host
    volumes:
      - ./data/pet_sensor:/data/pet_sensor

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema_registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.0
    container_name: control_center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
    restart: always

  # =============================================================================
  # SPARK STACK (Data Processing)
  # =============================================================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - delta-lake-data:/data/delta
      - ./spark/jars:/opt/spark/user-jars
      - ./spark/jobs:/opt/spark/jobs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark_worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - delta-lake-data:/data/delta
      - ./spark/jars:/opt/spark/user-jars
      - ./spark/jobs:/opt/spark/jobs
    depends_on:
      spark-master:
        condition: service_healthy
    restart: always

  # =============================================================================
  # MONITORING STACK (Prometheus + Grafana)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./data/prometheus/config:/etc/prometheus/
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8083:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      # No auth for development
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/pet-activity.json
    depends_on:
      - prometheus
      - output-postgres

volumes:
  pet-postgres-data:
  output-postgres-data:
  delta-lake-data:
  prefect-postgres-data:
  prefect-redis-data:
  openmetadata-mysql-data:
  openmetadata-es-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: pet-project-network
